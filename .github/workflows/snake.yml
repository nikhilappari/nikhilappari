name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *" # Automatically runs every 12 hours
  workflow_dispatch: # Allows manual triggering from the Actions tab
  push:
    branches:
      - main # Runs whenever you push changes to main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#2d3343,#0e4429,#006d32,#26a641,#39d353
            dist/github-snake-light.svg?palette=github-light&color_snake=#089182&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39

      - name: Push github-contribution-grid-snake.svg to GitHub Pages Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
